<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>El Temamy Commercial v2</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --orange: #F58220;
    --orange-deep: #E86A0C;
    --cream: #F7EEE2;
    --charcoal: #2B2622;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% 40%, #FFFBF6 0%, #F7EEE2 58%, #EFE2D1 100%); }
  .blob { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  #warm { position: absolute; inset: 0; opacity: 0; background: radial-gradient(60% 40% at 59% 72%, rgba(255,176,102,.5) 0%, rgba(255,176,102,0) 70%); }

  /* opening logo tile: the original logo file, only masked with rounded corners */
  #tile { position: absolute; left: 340px; top: 640px; width: 400px; height: 400px; border-radius: 92px; overflow: hidden; }
  #tile img { width: 100%; height: 100%; display: block; }

  /* phone */
  #phone { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  #phoneBody { position: absolute; inset: 0; border-radius: inherit; }
  #screen { position: absolute; left: 18px; top: 18px; width: 560px; height: 1176px; border-radius: 60px; overflow: hidden; background: #F3F3F6; transform-origin: 0 0; }
  .scr { position: absolute; left: 0; top: 0; width: 560px; height: 1176px; object-fit: cover; object-position: 50% 0; }
  #scrCat { object-position: 79% 0; }
  .btn { position: absolute; background: #1f1c1a; border-radius: 3px; }
  #shade { position: absolute; inset: 0; background: #1b120b; opacity: 0; }
  .ripple { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,.95); opacity: 0; }
  .hi { position: absolute; border-radius: 22px; border: 4px solid var(--orange); box-shadow: 0 0 0 0 rgba(245,130,32,.0), 0 0 26px rgba(245,130,32,.35); opacity: 0; }
  .ring { position: absolute; border-radius: 26px; border: 3px solid rgba(245,130,32,.9); opacity: 0; }
  #wipeLine { position: absolute; left: 0; width: 560px; height: 4px; background: var(--orange); box-shadow: 0 0 16px 2px rgba(245,130,32,.55); opacity: 0; }
  #scanLine { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(90deg, rgba(245,130,32,0), #F58220 12%, #FF9A3C 50%, #F58220 88%, rgba(245,130,32,0)); box-shadow: 0 0 18px 3px rgba(245,130,32,.5); opacity: 0; }
  #scanTint { position: absolute; background: linear-gradient(180deg, rgba(245,130,32,0) 0%, rgba(245,130,32,.10) 100%); opacity: 0; }
  #glass { position: absolute; inset: 0; border-radius: 60px; background: linear-gradient(125deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 30%); pointer-events: none; }

  svg { position: absolute; left: 0; top: 0; overflow: visible; }

  /* bag */
  #bag { position: absolute; left: 0; top: 0; width: 420px; height: 480px; transform-origin: 50% 100%; }
  #bagBack { position: absolute; left: 12px; top: -22px; width: 396px; height: 70px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #E6DCCD 0%, #EFE7DB 100%); }
  #bagFront { position: absolute; inset: 0; border-radius: 6px 6px 12px 12px; overflow: hidden;
    background: linear-gradient(180deg, #FFFFFF 0%, #FBF7F1 55%, #F1E9DE 100%); box-shadow: inset 0 -26px 50px rgba(150,110,60,.10); }
  #bagFront .fold { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(180deg, #F4EDE3 0%, #FBF7F1 100%); box-shadow: 0 3px 6px rgba(140,100,50,.12); }
  #bagFront .side { position: absolute; top: 0; bottom: 0; width: 30px; }
  #bagFront .side.l { left: 0; background: linear-gradient(90deg, rgba(120,80,30,.07), rgba(120,80,30,0)); }
  #bagFront .side.r { right: 0; background: linear-gradient(270deg, rgba(120,80,30,.10), rgba(120,80,30,0)); }
  #bagFront .crease { position: absolute; left: 0; right: 0; bottom: 64px; height: 2px; background: rgba(150,110,60,.08); }
  #bagFront .band { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: var(--orange); }
  #bagLabel { position: absolute; left: 50%; top: 104px; width: 184px; height: 184px; margin-left: -92px; border-radius: 40px; overflow: hidden; box-shadow: 0 6px 14px rgba(160,70,0,.18); }
  #bagLabel img { width: 100%; height: 100%; display: block; }
  .handle { position: absolute; left: 112px; top: -122px; width: 196px; height: 160px; border: 10px solid var(--orange); border-bottom: none; border-radius: 98px 98px 0 0; }
  #bagShadow { position: absolute; left: 0; top: 0; width: 540px; height: 66px; border-radius: 50%; background: radial-gradient(closest-side, rgba(90,55,20,.24), rgba(90,55,20,0)); }
  #check { position: absolute; left: 0; top: 0; width: 112px; height: 112px; border-radius: 50%; background: #FFFAF3; box-shadow: 0 14px 30px rgba(120,55,10,.20), inset 0 0 0 6px var(--orange); }

  #doorGlow { position: absolute; left: 0; top: 0; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,190,120,.85), rgba(255,170,90,.35) 45%, rgba(255,170,90,0)); opacity: 0; }

  /* headlines: each phrase is one locked text layer (opacity / position / scale / blur only) */
  .hl { position: absolute; left: 0; width: 1080px; text-align: center; direction: rtl; visibility: hidden; }
  .hl span.in { display: inline-block; font-family: 'Cairo', sans-serif; font-weight: 700; color: var(--charcoal); white-space: nowrap; line-height: 1.3; font-size: 84px; transform-origin: 50% 60%; }
  .hl .o { color: var(--orange-deep); }

  /* brand end frame */
  #end { position: absolute; inset: 0; clip-path: circle(0px at 640px 1400px);
    background: linear-gradient(160deg, #FE9D2F 0%, #FA851B 42%, #F3700A 100%); }
  #end .light { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 34%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%); }
  #end .shape { position: absolute; border-radius: 50%; background: #FFF3E2; }
  #endLogo { position: absolute; left: 290px; top: 470px; width: 500px; }
  #endLine1 { top: 1146px; visibility: visible; }
  #endLine1 span.in { color: #FFFFFF; font-size: 90px; font-weight: 800; text-shadow: 0 6px 24px rgba(140,55,0,.18); }
  #pillWrap { position: absolute; left: 0; width: 1080px; top: 1318px; text-align: center; }
  #pill { display: inline-block; direction: rtl; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 58px; color: #E0650B; background: #FFF6EA; padding: 10px 64px 18px; border-radius: 999px; box-shadow: 0 16px 40px rgba(130,50,0,.20); }

  #grain { position: absolute; inset: 0; opacity: .045; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 90% at 50% 45%, rgba(0,0,0,0) 62%, rgba(60,30,5,.14) 100%); }
</style>
</head>
<body>
<div id="stage">
  <!-- flowing brand shapes -->
  <svg class="blob" id="blobA" width="1400" height="1400" viewBox="0 0 1400 1400"><defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A3C"/><stop offset="1" stop-color="#F26F0A"/></linearGradient></defs>
    <path d="M700 90 C980 80 1290 300 1300 640 C1310 980 1060 1300 720 1310 C380 1320 110 1100 100 760 C90 420 420 100 700 90 Z" fill="url(#gA)"/></svg>
  <svg class="blob" id="blobB" width="1200" height="1200" viewBox="0 0 1200 1200">
    <path d="M620 80 C900 110 1130 360 1110 650 C1090 940 830 1130 560 1110 C290 1090 80 870 100 590 C120 310 340 50 620 80 Z" fill="url(#gA)"/></svg>
  <div id="warm"></div>

  <!-- S7 home outline + ground (drawn by the orange line) -->
  <svg id="houseSvg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs><filter id="glowF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <path id="doorFill" d="M585 1500 V1322 Q585 1300 607 1300 H673 Q695 1300 695 1322 V1500 Z" fill="#FFB36B" opacity="0"/>
    <g fill="none" stroke="#F58220" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path id="houseGlow" d="M20 1500 H360 V1120 L640 860 L920 1120 V1500 H1060" filter="url(#glowF)" opacity=".4" stroke-width="12"/>
      <path id="housePath" d="M20 1500 H360 V1120 L640 860 L920 1120 V1500 H1060"/>
      <path id="doorPath" d="M585 1500 V1322 Q585 1300 607 1300 H673 Q695 1300 695 1322 V1500"/>
      <path id="winPath" d="M640 1030 m-44 0 a44 44 0 1 0 88 0 a44 44 0 1 0 -88 0"/>
    </g>
  </svg>
  <div id="doorGlow"></div>

  <div id="tile"><img src="img/logo_tile.jpg"></div>

  <!-- phone with the real screenshots -->
  <div id="phone">
    <div id="phoneBody"></div>
    <div class="btn" id="btnR" style="right:-6px;top:290px;width:6px;height:140px"></div>
    <div class="btn" id="btnL1" style="left:-6px;top:240px;width:6px;height:84px"></div>
    <div class="btn" id="btnL2" style="left:-6px;top:350px;width:6px;height:84px"></div>
    <div id="screen">
      <img class="scr" id="scrHome" src="img/screen_home.png">
      <div class="hi" id="hiCats"></div>
      <div class="ripple" id="rip1"></div>
      <img class="scr" id="scrCat" src="img/screen_cat.png">
      <img class="scr" id="scrLoy" src="img/screen_loyalty.jpg">
      <div class="hi" id="hiPts"></div>
      <div class="ring" id="ringPts"></div>
      <div id="wipeLine"></div>
      <div id="shade"></div>
      <img class="scr" id="scrRx" src="img/screen_rx.jpg">
      <div class="ripple" id="rip2"></div>
      <div id="scanTint"></div>
      <div id="scanLine"></div>
      <div id="glass"></div>
    </div>
  </div>

  <!-- orange line: scan line peels off the phone and travels to the order -->
  <svg id="pathSvg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g fill="none" stroke-linecap="round">
      <path id="cometGlow" d="" stroke="#F58220" stroke-width="14" filter="url(#glowF)" opacity=".45"/>
      <path id="comet" d="" stroke="#F58220" stroke-width="6"/>
    </g>
  </svg>

  <!-- order preparation -->
  <div id="bagShadow"></div>
  <div id="bag">
    <div class="handle" style="left:126px;top:-114px;border-color:#D96A12"></div>
    <div id="bagBack"></div>
    <div id="bagFront">
      <div class="fold"></div>
      <div class="side l"></div><div class="side r"></div>
      <div class="crease"></div>
      <div class="band"></div>
      <div id="bagLabel"><img src="img/logo_tile.jpg"></div>
    </div>
    <div class="handle"></div>
  </div>
  <div id="check">
    <svg width="112" height="112" viewBox="0 0 112 112"><path id="checkPath" d="M35 58 L50 73 L79 42" fill="none" stroke="#F58220" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <!-- headlines: approved copy only -->
  <div class="hl" id="h1" style="top:1120px"><span class="in" style="font-size:92px;font-weight:800">صيدلية في كل <span class="o">بيت</span></span></div>
  <div class="hl" id="h2" style="top:250px"><span class="in">كل اللي تحتاجه في <span class="o">مكان واحد</span></span></div>
  <div class="hl" id="h3" style="top:250px"><span class="in">تصفح <span class="o">منتجاتك</span> بسهولة</span></div>
  <div class="hl" id="h4" style="top:250px"><span class="in">اجمع <span class="o">نقاطك</span> واستفاد بيها</span></div>
  <div class="hl" id="h5" style="top:250px"><span class="in">صوّر <span class="o">روشتتك</span> أو أدويتك</span></div>
  <div class="hl" id="h6" style="top:250px"><span class="in">طلبك <span class="o">بيتجهز</span></span></div>
  <div class="hl" id="h7" style="top:250px"><span class="in">توصيل لحد <span class="o">عندك</span></span></div>

  <!-- brand end frame -->
  <div id="end">
    <div class="shape" id="s1" style="left:640px;top:-260px;width:820px;height:820px;opacity:.10"></div>
    <div class="shape" id="s2" style="left:-420px;top:1420px;width:1040px;height:1040px;opacity:.12"></div>
    <div class="shape" id="s3" style="left:820px;top:1560px;width:420px;height:420px;opacity:.08"></div>
    <div class="light"></div>
    <img id="endLogo" src="img/logo_white.png">
    <div class="hl" id="endLine1"><span class="in">صيدلية في كل بيت</span></div>
    <div id="pillWrap"><span id="pill">اطلب عبر التطبيق</span></div>
  </div>

  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const lin = x => x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eIOq = x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const eIOs = x => -(Math.cos(Math.PI * x) - 1) / 2;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIn = x => x * x * x;
const eBack = x => { const c1 = 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function tr(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) { const [t0, v0] = keys[i - 1]; return lerp(v0, v1, (e || eIO)((t - t0) / (t1 - t0))); }
  }
  return keys[keys.length - 1][1];
}
const set = (el, css) => Object.assign(el.style, css);

(function grain() {
  const c = $('grain'), g = c.getContext('2d'), im = g.createImageData(1080, 1920);
  let s = 1337; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rnd() - .5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
})();

// ---------- geometry ----------
const SW = 560, SH = 1176, BZ = 18, BW = SW + 2 * BZ, BH = SH + 2 * BZ;
// object-fit: cover mapping (image px -> screen css px) for each screenshot
const MAP = {
  home: { s: Math.max(SW / 762, SH / 1597), w: 762 },
  loy:  { s: Math.max(SW / 798, SH / 1600), w: 798 },
  rx:   { s: Math.max(SW / 785, SH / 1600), w: 785 },
};
for (const m of Object.values(MAP)) m.ox = (SW - m.w * m.s) / 2;
const px = (m, x, y) => [x * m.s + m.ox, y * m.s];
function box(el, m, x0, y0, x1, y1, pad = 0) {
  const [a, b] = px(m, x0, y0), [c, d] = px(m, x1, y1);
  set(el, { left: (a - pad) + 'px', top: (b - pad) + 'px', width: (c - a + 2 * pad) + 'px', height: (d - b + 2 * pad) + 'px' });
}
box($('hiCats'), MAP.home, 12, 792, 752, 1122);
box($('hiPts'), MAP.loy, 262, 108, 540, 296);
box($('ringPts'), MAP.loy, 262, 108, 540, 296);
const TAP1 = px(MAP.home, 675, 965);          // "الأدوية" category tile
const TAP2 = px(MAP.rx, 393, 238);            // "روشتة جديدة" button
const CARD = { x0: px(MAP.rx, 186, 0)[0], x1: px(MAP.rx, 613, 0)[0], y0: px(MAP.rx, 0, 617)[1], y1: px(MAP.rx, 0, 1090)[1] };

function headline(el, t, tin, tout) {
  const inner = el.firstElementChild;
  const a = eOut(p(t, tin, tin + 0.75));
  const b = eIO(p(t, tout, tout + 0.38));
  set(inner, { transform: `translateY(${(1 - a) * 26 - b * 16}px) scale(${lerp(0.97, 1, a)})`,
    opacity: String(a * (1 - b)), filter: a < 1 ? `blur(${(1 - a) * 6}px)` : (b > 0 ? `blur(${b * 3}px)` : 'none') });
  el.style.visibility = (a > 0 && b < 1) ? 'visible' : 'hidden';
}
function fitHeadlines() {
  for (const el of document.querySelectorAll('.hl')) {
    const inner = el.firstElementChild; const w = inner.getBoundingClientRect().width;
    if (w > 940) inner.style.fontSize = (parseFloat(getComputedStyle(inner).fontSize) * 940 / w) + 'px';
  }
}

// ---------- timeline ----------
function phoneState(t) {
  const s = tr(t, [[3.2, 1.0], [5.2, 1.04, eIOs], [6.4, 1.06], [7.55, 1.06], [7.95, 1.1], [8.5, 1.04], [10.4, 1.06, eIOs], [11.0, 1.04], [14.0, 1.18, eIOs]]);
  const ry = tr(t, [[5.3, 0], [6.4, -7], [7.35, -7], [7.95, 0], [8.2, 0], [9.2, 6], [10.2, 6], [10.75, 0]]);
  const rx = tr(t, [[5.3, 0], [6.4, 3], [7.35, 3], [7.95, 0], [8.2, 0], [9.2, 2], [10.2, 2], [10.75, 0]]);
  const exit = eIO(p(t, 14.3, 15.0));
  const cy = Math.max(1100, 440 + (BH / 2) * s) - exit * 1500;
  return { s, cx: 540, cy, ry, rx, exit };
}

function renderAt(t) {
  // brand shapes drift slowly
  set($('blobA'), { transform: `translate(${-820 + Math.sin(t * .22) * 30}px, ${-760 + t * 7}px) rotate(${t * 1.5}deg) scale(${1 + Math.sin(t * .3) * .02})`, opacity: '.16' });
  set($('blobB'), { transform: `translate(${560 + Math.cos(t * .2) * 26}px, ${1320 - t * 6}px) rotate(${-t * 1.2}deg)`, opacity: '.11' });

  // ---------- S1: original logo tile ----------
  const tIn = eOut(p(t, 0.2, 1.1));
  const tileOut = eIO(p(t, 2.35, 2.65));
  set($('tile'), { opacity: String(tIn * (1 - tileOut)), transform: `translateY(${(1 - tIn) * 22}px) scale(${lerp(0.97, 1, tIn)})`,
    boxShadow: `0 30px 70px rgba(200,90,10,${.22 * tIn}), 0 10px 22px rgba(200,90,10,${.12 * tIn})`, display: tileOut < 1 ? 'block' : 'none' });

  // ---------- phone (tile grows into the phone) ----------
  const ph = phoneState(t);
  const grow = eIOq(p(t, 2.35, 3.2));
  const w = lerp(400, BW, grow), h = lerp(400, BH, grow), rad = lerp(92, 76, grow);
  const cx0 = lerp(540, ph.cx, grow), cy0 = lerp(840, ph.cy, grow);
  const bez = eIO(p(t, 2.85, 3.3)), scr = eIO(p(t, 2.9, 3.35));
  const phone = $('phone');
  set(phone, {
    width: w + 'px', height: h + 'px', borderRadius: rad + 'px',
    transform: `translate(${cx0 - w / 2}px, ${cy0 - h / 2}px) perspective(2600px) rotateY(${ph.ry}deg) rotateX(${ph.rx}deg) scale(${lerp(1, ph.s, grow)})`,
    opacity: String(1 - eIO(p(t, 14.5, 15.0))), display: t >= 2.35 && t < 15.0 ? 'block' : 'none',
  });
  const orange = [248, 132, 25], dark = [26, 24, 23];
  const col = orange.map((c, i) => Math.round(lerp(c, dark[i], bez)));
  set($('phoneBody'), {
    background: `linear-gradient(145deg, rgb(${col.map(c => c + 24 * bez)}) 0%, rgb(${col}) 42%, rgb(${col}) 100%)`,
    boxShadow: `0 ${30 + 40 * grow}px ${70 + 60 * grow}px rgba(90,45,10,${.22 + .06 * grow}), 0 ${10 + 12 * grow}px ${22 + 22 * grow}px rgba(90,45,10,.14), inset 0 0 0 ${2 * bez}px rgba(255,255,255,.10)`,
  });
  for (const b of ['btnR', 'btnL1', 'btnL2']) $(b).style.opacity = String(bez);
  set($('screen'), { opacity: String(scr), left: (BZ * grow) + 'px', top: (BZ * grow) + 'px', transform: `scale(${lerp(400 / BW, 1, grow)})`, visibility: scr > 0 ? 'visible' : 'hidden' });

  // S2: highlight the real categories row, tap "الأدوية", push to the categories screen
  const hc = eOut(p(t, 4.05, 4.45)) * (1 - eIO(p(t, 4.95, 5.2)));
  set($('hiCats'), { opacity: String(hc), transform: `scale(${lerp(1.03, 1, eOut(p(t, 4.05, 4.45)))})` });
  const r1 = p(t, 4.72, 5.12);
  set($('rip1'), { left: (TAP1[0] - 120) + 'px', top: (TAP1[1] - 120) + 'px', transform: `scale(${eOut(r1)})`, opacity: String(r1 > 0 && r1 < 1 ? .4 * (1 - r1) : 0) });
  const nav1 = eIO(p(t, 4.95, 5.5));
  set($('scrCat'), { transform: `translateX(${(nav1 - 1) * 100}%)`, visibility: nav1 > 0 ? 'visible' : 'hidden', boxShadow: '26px 0 50px rgba(0,0,0,.16)' });
  set($('scrHome'), { transform: `translateX(${nav1 * 30}%)`, visibility: nav1 < 1 ? 'visible' : 'hidden' });

  // S3 -> S4: clean top-down wipe with an orange leading edge
  const wp = eIO(p(t, 7.6, 8.2));
  set($('scrLoy'), { clipPath: `inset(0 0 ${(1 - wp) * 100}% 0)`, visibility: wp > 0 ? 'visible' : 'hidden' });
  set($('wipeLine'), { top: (wp * SH - 2) + 'px', opacity: String(wp > 0 && wp < 1 ? Math.min(1, Math.sin(Math.PI * wp) * 2) : 0) });
  // S4: soft emphasis on the real points balance, one gentle pulse
  const hp = eOut(p(t, 8.95, 9.3)) * (1 - eIO(p(t, 10.2, 10.5)));
  set($('hiPts'), { opacity: String(hp) });
  const pr = p(t, 9.35, 10.05);
  set($('ringPts'), { opacity: String(pr > 0 && pr < 1 ? .7 * (1 - pr) : 0), transform: `scale(${1 + .12 * eOut(pr)})` });

  // S4 -> S5: native push to the prescription screen
  const nav2 = eIO(p(t, 10.5, 11.0));
  set($('scrRx'), { transform: `translateX(${(nav2 - 1) * 100}%)`, visibility: nav2 > 0 ? 'visible' : 'hidden', boxShadow: '26px 0 50px rgba(0,0,0,.16)' });
  $('shade').style.opacity = String(nav2 * 0.25 * (nav2 < 1 ? 1 : 0));
  if (nav2 > 0) { $('scrLoy').style.transform = `translateX(${nav2 * 30}%)`; $('scrCat').style.visibility = 'hidden'; }
  else $('scrLoy').style.transform = 'none';
  const r2 = p(t, 11.75, 12.15);
  set($('rip2'), { left: (TAP2[0] - 120) + 'px', top: (TAP2[1] - 120) + 'px', transform: `scale(${eOut(r2)})`, opacity: String(r2 > 0 && r2 < 1 ? .35 * (1 - r2) : 0) });
  // S5: one thin scan line across the real prescription card
  const sp = eIOs(p(t, 12.55, 13.65));
  const lineY = lerp(CARD.y0, CARD.y1, sp);
  const scanOn = t >= 12.5 && t < 14.3;
  set($('scanLine'), { left: (CARD.x0 - 14) + 'px', width: (CARD.x1 - CARD.x0 + 28) + 'px', top: (lineY - 2.5) + 'px', opacity: String(scanOn ? p(t, 12.5, 12.6) : 0) });
  set($('scanTint'), { left: CARD.x0 + 'px', width: (CARD.x1 - CARD.x0) + 'px', top: CARD.y0 + 'px', height: (lineY - CARD.y0) + 'px', opacity: String(scanOn ? 1 - p(t, 13.9, 14.25) : 0) });

  // ---------- S6: the scan line leaves the phone as an orange path ----------
  const P = phoneState(14.3);
  const fx = x => P.cx + P.s * (x - SW / 2), fy = y => P.cy + P.s * (y - SH / 2);
  const lx0 = fx(CARD.x0 - 14), lx1 = fx(CARD.x1 + 14), ly = fy(CARD.y1);
  const comet = $('comet'), cg = $('cometGlow');
  const d = `M${lx0} ${ly} L${lx1} ${ly} C${lx1 + 150} ${ly} 1010 ${ly + 150} 910 ${ly + 270} C810 ${ly + 380} 340 ${ly + 380} 220 ${ly + 220} C120 ${ly + 80} 190 1060 380 960 C450 925 505 915 540 922`;
  if (comet.getAttribute('d') !== d) { comet.setAttribute('d', d); cg.setAttribute('d', d); comet._len = comet.getTotalLength(); }
  const Lp = comet._len, seg0 = lx1 - lx0;
  const cp = p(t, 14.3, 15.2);
  // the line stays pinned to the phone until it peels off
  if (cp > 0 && cp < 1) {
    const e = eIO(cp), head = lerp(seg0, Lp, e);
    const len = cp < 0.7 ? lerp(seg0, 300, eOut(cp / 0.7)) : lerp(300, 0, eIn((cp - 0.7) / 0.3));
    const tail = Math.max(0, head - len);
    for (const el of [comet, cg]) { el.style.strokeDasharray = `${head - tail} ${Lp * 2}`; el.style.strokeDashoffset = String(-tail); el.style.opacity = el === cg ? '.45' : '1'; }
  } else { comet.style.opacity = cg.style.opacity = '0'; }

  // ---------- S6: order preparation ----------
  const bagIn = eOut(p(t, 14.85, 15.4));
  const mv = eIO(p(t, 16.5, 17.0));
  const trav = eIO(p(t, 17.05, 17.8));
  const bagS = lerp(1, 0.42, mv) * lerp(1, 0.25 / 0.42, trav) * lerp(0.95, 1, bagIn);
  let bagX = lerp(540, 232, mv), bagB = lerp(1440, 1500, mv) + (1 - bagIn) * 90;
  bagX = lerp(bagX, 640, trav); bagB -= Math.abs(Math.sin(trav * Math.PI * 2)) * 8 * (trav > 0 && trav < 1 ? 1 : 0);
  const wt = Math.max(0, t - 15.42);
  const wob = t > 15.42 ? Math.exp(-wt * 6) * Math.sin(wt * 22) : 0;
  const bagFade = 1 - eIO(p(t, 17.7, 17.92));
  set($('bag'), {
    transform: `translate(${bagX - 210}px, ${bagB - 480}px) scale(${bagS}) scaleY(${1 - wob * 0.014})`,
    opacity: String(bagIn * bagFade), display: t > 14.85 && bagFade > 0 ? 'block' : 'none',
  });
  set($('bagShadow'), { transform: `translate(${bagX - 270}px, ${bagB - 34}px) scale(${bagS})`, opacity: String(bagIn * bagFade) });
  const ck = p(t, 15.9, 16.2), ckOut = eIO(p(t, 16.45, 16.65));
  set($('check'), { transform: `translate(${734 - 56}px, ${968 - 56}px) scale(${clamp(eBack(ck), 0, 1.3) * (1 - ckOut * 0.3)})`, opacity: String((ck > 0 ? 1 : 0) * (1 - ckOut)), display: ck > 0 && ckOut < 1 ? 'block' : 'none' });
  const cpth = $('checkPath'); if (!cpth._len) cpth._len = cpth.getTotalLength();
  set(cpth, { strokeDasharray: cpth._len, strokeDashoffset: String(cpth._len * (1 - eOut(p(t, 15.98, 16.22)))) });

  // ---------- S7: delivery ----------
  const hpth = $('housePath'), hg = $('houseGlow'), dp = $('doorPath'), wpth = $('winPath');
  for (const el of [hpth, hg, dp, wpth]) if (!el._len) el._len = el.getTotalLength();
  const hd = eIO(p(t, 16.65, 17.5));
  for (const el of [hpth, hg]) set(el, { strokeDasharray: el._len, strokeDashoffset: String(el._len * (1 - hd)) });
  set(dp, { strokeDasharray: dp._len, strokeDashoffset: String(dp._len * (1 - eIO(p(t, 17.25, 17.6)))) });
  set(wpth, { strokeDasharray: wpth._len, strokeDashoffset: String(wpth._len * (1 - eIO(p(t, 17.35, 17.65)))) });
  const houseFade = 1 - eIO(p(t, 17.95, 18.25));
  set($('houseSvg'), { opacity: String(houseFade), display: t > 16.65 && houseFade > 0 ? 'block' : 'none' });
  const dg = eIO(p(t, 17.68, 18.0));
  $('doorFill').setAttribute('opacity', String(dg * 0.95));
  set($('doorGlow'), { transform: `translate(${640 - 260}px, ${1400 - 260}px) scale(${lerp(0.6, 1.2, dg)})`, opacity: String(dg * houseFade) });
  $('warm').style.opacity = String(eIO(p(t, 16.6, 17.8)) * 0.85);

  // ---------- headlines ----------
  headline($('h1'), t, 0.95, 2.3);
  headline($('h2'), t, 3.2, 4.98);
  headline($('h3'), t, 5.45, 7.55);
  headline($('h4'), t, 8.2, 10.4);
  headline($('h5'), t, 11.0, 14.15);
  headline($('h6'), t, 14.95, 16.45);
  headline($('h7'), t, 16.85, 17.92);

  // ---------- S8: brand end frame ----------
  const rv = eIO(p(t, 17.85, 18.45));
  set($('end'), { clipPath: `circle(${rv * 2300}px at 640px 1400px)`, display: rv > 0 ? 'block' : 'none' });
  const lg = eOut(p(t, 18.05, 18.5));
  set($('endLogo'), { opacity: String(lg), transform: `scale(${lerp(0.97, 1, lg)})`, filter: lg < 1 ? `blur(${(1 - lg) * 8}px)` : 'none' });
  const e1 = eOut(p(t, 18.15, 18.55));
  set($('endLine1').firstElementChild, { transform: `translateY(${(1 - e1) * 24}px) scale(${lerp(0.97, 1, e1)})`, opacity: String(e1), filter: e1 < 1 ? `blur(${(1 - e1) * 6}px)` : 'none' });
  const e2 = eOut(p(t, 18.22, 18.6));
  set($('pill'), { transform: `translateY(${(1 - e2) * 24}px) scale(${lerp(0.97, 1, e2)})`, opacity: String(e2) });
  set($('s1'), { transform: `translate(${(1 - rv) * 60}px, ${(1 - rv) * -40}px)` });
  set($('s2'), { transform: `translate(${(1 - rv) * -60}px, ${(1 - rv) * 50}px)` });
}
window.renderAt = renderAt;
window.ready = Promise.all([document.fonts.load('700 84px Cairo', 'صيدلية'), document.fonts.load('800 90px Cairo', 'صيدلية'), document.fonts.ready, ...[...document.images].map(i => i.decode())])
  .then(() => { for (const el of document.querySelectorAll('.hl')) el.style.visibility = 'visible'; fitHeadlines(); renderAt(0); return true; });
</script>
</body>
